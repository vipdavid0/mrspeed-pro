<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Stylized Speed Line Gradients -->
    <linearGradient id="leftBrush" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="80" y2="50">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="rightBrush" gradientUnits="userSpaceOnUse" x1="320" y1="50" x2="400" y2="50">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Speed Lines -->
  <path d="M20 40 L72 40 M8 50 L60 50"
        stroke="url(#leftBrush)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Main Branding Text (Centered and adjusted vertically) -->
  <text x="200" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" fill="#00E5FF" font-size="42">
    <tspan font-weight="300" filter="url(#glow)">Mr</tspan>
    <tspan dx="10" font-weight="900" filter="url(#strongGlow)">Speed</tspan>
  </text>

  <!-- Right Speed Lines -->
  <path d="M328 35 L380 35 M340 45 L392 45 M332 55 L368 55"
        stroke="url(#rightBrush)" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>