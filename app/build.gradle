plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

kotlin {
    androidTarget {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
    
    jvm("desktop") {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
    
    sourceSets {
        commonMain {
            dependencies {
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.material3
                implementation compose.materialIconsExtended
                implementation compose.ui
                implementation compose.components.resources
                implementation compose.components.uiToolingPreview
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
                implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1"
                implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.0"
                implementation "io.coil-kt.coil3:coil-compose:3.0.0-rc01"
                implementation "io.coil-kt.coil3:coil-svg:3.0.0-rc01"
                implementation "io.coil-kt.coil3:coil-network-okhttp:3.0.0-rc01"
            }
        }
        
        androidMain {
            dependencies {
                implementation "androidx.activity:activity-compose:1.9.3"
                implementation "androidx.appcompat:appcompat:1.6.1"
                implementation "androidx.core:core-ktx:1.13.1"
                implementation "com.google.android.material:material:1.12.0"
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
                implementation "com.google.android.gms:play-services-ads:23.6.0"
            }
        }
        
        desktopMain {
            resources.srcDirs += "src/desktopMain/resources"
            dependencies {
                implementation compose.desktop.currentOs
                implementation "org.json:json:20240303"
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.8.1"
                implementation "javazoom:jlayer:1.0.1"
            }
        }

        commonTest {
            dependencies {
                implementation kotlin("test")
            }
        }
    }
}

android {
    namespace 'com.mr.speed.test'
    compileSdk 35

    defaultConfig {
        applicationId "com.mr.speed.test"
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName "1.2.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android-specific dependencies
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Room Database
    def room_version = "2.6.1" 
    add("kspAndroid", "androidx.room:room-compiler:$room_version")
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    implementation "androidx.work:work-runtime-ktx:2.10.0" 

    implementation "androidx.glance:glance-appwidget:1.0.0"
    implementation "androidx.glance:glance-material3:1.0.0"
    implementation "androidx.tvprovider:tvprovider:1.0.0"

    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "io.coil-kt:coil-svg:2.7.0"

    implementation 'com.google.ar:core:1.56.0'

    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "com.google.guava:guava:33.3.1-android"

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
}

def osName = System.getProperty("os.name").toLowerCase()
def selectedFormats = [org.jetbrains.compose.desktop.application.dsl.TargetFormat.Exe, org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi]
if (osName.contains("linux")) {
    selectedFormats = [org.jetbrains.compose.desktop.application.dsl.TargetFormat.AppImage, org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb, org.jetbrains.compose.desktop.application.dsl.TargetFormat.Rpm]
} else if (osName.contains("mac") || osName.contains("darwin")) {
    selectedFormats = [org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg, org.jetbrains.compose.desktop.application.dsl.TargetFormat.Pkg]
}

compose.desktop {
    application {
        mainClass = "com.fdossena.speedtest.MainKt"
        nativeDistributions {
            targetFormats(*selectedFormats)
            packageName = "MrSpeed"
            packageVersion = "1.2.3"
            description = "Mr Speed PRO Desktop Speedtest & Network Analytics"
            copyright = "Copyright (c) Supreme Developments"
            vendor = "Supreme Developments"

            windows {
                iconFile.set(project.file("src/desktopMain/resources/favicon_cyan.ico"))
                licenseFile.set(project.file("src/desktopMain/resources/license.rtf"))
                shortcut = true
                menu = true
                menuGroup = "Mr Speed PRO"
                upgradeUuid = "624df873-fb2c-4b00-86f2-1b5de2667334"
            }

            linux {
                iconFile.set(project.file("src/desktopMain/resources/favicon_cyan.png"))
                shortcut = true
                menuGroup = "Mr Speed PRO"
                appCategory = "Network"
            }

            macOS {
                iconFile.set(project.file("src/desktopMain/resources/favicon_cyan.png"))
                bundleID = "com.mr.speed.test"
                appCategory = "public.app-category.utilities"
                minimumSystemVersion = "10.15.0"
                signing {
                    sign.set(false)
                }
            }
        }
    }
}

compose.resources {
    packageOfResClass = "com.mr.speed.test"
    generateResClass = always
}

ksp {
    arg("jvmTarget", "17")
    arg("room.generateKotlin", "true")
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}
