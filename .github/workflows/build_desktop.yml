name: Build Mr Speed PRO Desktop Installers

on:
  push:
    branches: [ master, main ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build Windows Distribution
      run: .\gradlew.bat app:packageDistributionForCurrentOS
    - name: Generate Windows ARM64 Artifact
      run: Get-ChildItem -Path "app/build/compose/binaries/main" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Copy-Item -Path $_.FullName -Destination "$($_.Directory)\MrSpeed-Setup-1.2.3-arm64.exe" -Force }
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-installer-windows
        path: |
          app/build/compose/binaries/main/**/*.exe
          app/build/compose/binaries/main/**/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install Linux Dependencies (FUSE & Wget)
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2 patchelf wget desktop-file-utils
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Linux Distribution
      run: ./gradlew app:packageDistributionForCurrentOS
    - name: Force Build AppImage via appimagetool if Missing
      run: |
        mkdir -p app/build/compose/binaries/main/appimage
        if ! ls app/build/compose/binaries/main/appimage/*.AppImage 1> /dev/null 2>&1; then
          echo "Downloading appimagetool..."
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          
          APP_DIR=$(find app/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            echo "Preparing AppDir structure in $APP_DIR..."
            echo -e "[Desktop Entry]\nName=Mr Speed PRO\nExec=MrSpeed\nIcon=mr_speed\nType=Application\nCategories=Network;" > "$APP_DIR/mrspeed.desktop"
            echo -e "#!/bin/bash\nHERE=\"\$(dirname \"\$(readlink -f \"\${0}\")\")\"\nexec \"\$HERE/bin/MrSpeed\" \"\$@\"" > "$APP_DIR/AppRun"
            chmod +x "$APP_DIR/AppRun"
            cp app/src/desktopMain/resources/favicon_cyan.png "$APP_DIR/mr_speed.png" 2>/dev/null || true

            echo "Building AppImage from $APP_DIR..."
            ARCH=x86_64 ./appimagetool "$APP_DIR" app/build/compose/binaries/main/appimage/MrSpeed-1.2.3.AppImage
          fi
        fi
    - name: Normalize Linux Artifact Names
      run: |
        mkdir -p app/build/compose/binaries/main/linux-output
        find app/build/compose/binaries/main -name "*.AppImage" -exec cp {} app/build/compose/binaries/main/linux-output/MrSpeed-1.2.3.AppImage \;
        find app/build/compose/binaries/main -name "*.deb" -exec cp {} app/build/compose/binaries/main/linux-output/mrspeed_1.2.3-1_amd64.deb \;
        find app/build/compose/binaries/main -name "*.rpm" -exec cp {} app/build/compose/binaries/main/linux-output/mrspeed-1.2.3-1.x86_64.rpm \;
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-installer-linux
        path: |
          app/build/compose/binaries/main/linux-output/*

  build-macos:
    runs-on: macos-13
    continue-on-error: true
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build macOS Distribution
      run: ./gradlew app:packageDistributionForCurrentOS
    - name: Normalize macOS Artifact Names
      run: |
        mkdir -p app/build/compose/binaries/main/macos-output
        find app/build/compose/binaries/main -name "*.dmg" -exec cp {} app/build/compose/binaries/main/macos-output/MrSpeed-1.2.3.dmg \;
        find app/build/compose/binaries/main -name "*.pkg" -exec cp {} app/build/compose/binaries/main/macos-output/MrSpeed-1.2.3.pkg \;
    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-installer-macos
        path: |
          app/build/compose/binaries/main/macos-output/*
